version: "2"
sql:
  - engine: "postgresql"
    queries: "query.sql"
    schema: "schema.sql"
    gen:
      go:
        package: "db"
        out: "db"
        sql_package: "pgx/v5"
  - engine: "sqlite"
    queries: "query.cache.sql"
    schema: "schema.cache.sql"
    gen:
      go:
        package: "cacheutils"
        out: "cacheutils"